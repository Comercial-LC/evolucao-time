<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://wrbbmtaxerlqzaqfctqn.supabase.co; connect-src https://wrbbmtaxerlqzaqfctqn.supabase.co wss://wrbbmtaxerlqzaqfctqn.supabase.co https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; manifest-src 'none'; worker-src blob: https://cdn.jsdelivr.net">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Evolução do time comercial | LC Sistemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F5F8F5; --ink:#16231C; --muted:#56665D; --line:#D4DCD6;
  --side:#14261C; --side-ink:#DCE8DF; --side-muted:#8FA597; --side-active:#21402E;
  --moss:#2F6B45; --moss-soft:#DCEBDF; --on-moss:#FFFFFF;
  --amber:#9A6209; --amber-soft:#F6E8CF; --rose:#A8423A; --rose-soft:#F6DFDC; --blue:#1E5FA8;
  --ring-1:#2F6B45; --ring-2:#6FA57C; --ring-3:#B5D3BA; --ring-bg:#E3EAE4; --focus:#1E5FA8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1511; --surface:#16201A; --surface-2:#1C2822; --ink:#E5EEE8; --muted:#9AAEA2; --line:#2A3830;
    --side:#0A110D; --side-ink:#DCE8DF; --side-muted:#7F9587; --side-active:#1B3324;
    --moss:#7CC08F; --moss-soft:#1E3526; --on-moss:#0C1810;
    --amber:#E3AA4E; --amber-soft:#382C15; --rose:#E88C82; --rose-soft:#3A1F1C; --blue:#80B4F0;
    --ring-1:#7CC08F; --ring-2:#4E8A5F; --ring-3:#2E5639; --ring-bg:#1F2C24; --focus:#80B4F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16201A; --surface-2:#1C2822; --ink:#E5EEE8; --muted:#9AAEA2; --line:#2A3830;
  --side:#0A110D; --side-ink:#DCE8DF; --side-muted:#7F9587; --side-active:#1B3324;
  --moss:#7CC08F; --moss-soft:#1E3526; --on-moss:#0C1810;
  --amber:#E3AA4E; --amber-soft:#382C15; --rose:#E88C82; --rose-soft:#3A1F1C; --blue:#80B4F0;
  --ring-1:#7CC08F; --ring-2:#4E8A5F; --ring-3:#2E5639; --ring-bg:#1F2C24; --focus:#80B4F0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0;letter-spacing:-0.01em}
h1{font-size:clamp(1.6rem,3vw,2.2rem)}
h2{font-size:1.35rem}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .small{font-size:.9rem}

/* estrutura */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;padding:24px 14px;position:sticky;top:0;height:100dvh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;line-height:1.15;display:block}
.brand span{color:var(--side-muted);font-size:.85rem}
.nav{display:grid;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer;font-weight:600}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 var(--ring-2)}
.badge{background:var(--amber);color:#1b1306;border-radius:999px;font-size:.78rem;padding:1px 8px;font-weight:700}
.side-foot{margin-top:auto;display:grid;gap:6px;padding:12px 8px 0;border-top:1px solid var(--side-active)}
.side-foot .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot button{border:0;background:none;color:var(--side-muted);text-align:left;padding:4px 0;cursor:pointer}
.side-foot button:hover{color:var(--side-ink)}
.main{padding:30px clamp(16px,3vw,44px) 90px;max-width:1240px;width:100%}
.page-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head p{color:var(--muted);margin-top:6px;max-width:64ch}
@media (max-width:899px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:14px;gap:12px}
  .nav{display:flex;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap}
  .side-foot{flex-direction:row;display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:0;padding-top:10px}
  .main{padding-top:20px}
}

/* componentes */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--moss);color:var(--on-moss);padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;line-height:1.2;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.danger{background:transparent;color:var(--rose);border-color:var(--rose)}
.linkish{border:0;background:none;padding:0;color:var(--moss);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkish.red{color:var(--rose)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.panel-head p{color:var(--muted);font-size:.9rem}
.stack{display:grid;gap:18px}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid3{display:grid;gap:18px;grid-template-columns:2fr 1fr}
@media (max-width:1050px){.grid3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-family:"Bricolage Grotesque",sans-serif;font-size:1.7rem;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:.9rem}
.kpi.warn{border-color:var(--amber);background:var(--amber-soft)}
.delta-up{color:var(--moss);font-weight:700}
.delta-down{color:var(--rose);font-weight:700}
.chart-box{position:relative;height:290px}
.chart-box.tall{height:340px}
.chart-box.short{height:220px}
.empty-chart{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:16px}

/* tabela */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.85rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.person{display:flex;gap:10px;align-items:center;min-width:180px}
.person b{display:block;font-weight:600}
.person span{color:var(--muted);font-size:.85rem}

/* cards de pessoa */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pcard{display:grid;gap:10px;justify-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 14px;cursor:pointer}
.pcard:hover{border-color:var(--moss)}
.pcard.archived{opacity:.6}
.pcard .meta{font-size:.88rem}

/* anéis */
.ring-bg{fill:var(--ring-bg)} .ring{fill:none}
.ring.r1{stroke:var(--ring-1)} .ring.r2{stroke:var(--ring-2)} .ring.r3{stroke:var(--ring-3)}
.ring-empty{fill:none;stroke:var(--line);stroke-dasharray:3 4;stroke-width:1.5}
.core{fill:var(--surface)} .core-t{fill:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-weight:700}

/* pessoa */
.person-head{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.person-head .info{flex:1 1 260px}
.back{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;margin-bottom:10px;font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:4px 0 2px}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--moss)}

/* listas */
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface-2);display:grid;gap:6px}
.item-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.item h3{font-size:1.02rem}
.meta{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
.pill.aberto,.pill.pendente{background:var(--amber-soft);color:var(--amber)}
.pill.andamento,.pill.ativo{background:var(--moss-soft);color:var(--moss)}
.pill.concluido{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.pill.late,.pill.recusado{background:var(--rose-soft);color:var(--rose)}
.prose{white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--moss-soft);padding:3px 12px;border-radius:999px;font-size:.92rem}
.cert{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.doc-ico{width:56px;height:56px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--muted);font-weight:700;font-size:.8rem;text-align:center}
.cv{display:grid;gap:20px}
.cv section{display:grid;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.exp{display:grid;gap:2px}

/* linha do tempo */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:84px 16px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl .d{color:var(--muted);font-size:.86rem;text-align:right;padding-top:1px}
.tl .k{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--moss);position:relative;z-index:1}
.tl li::before{content:"";position:absolute;left:99px;top:12px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .k.aval{background:var(--blue)} .tl .k.one{background:var(--ring-2)} .tl .k.melh{background:var(--amber)} .tl .k.ok{background:var(--surface);border:2px solid var(--moss)}

/* avisos e telas cheias */
.notice{padding:12px 16px;border-radius:12px;background:var(--amber-soft);border:1px solid var(--line)}
.center{min-height:calc(100dvh - 60px);display:grid;place-items:center;padding:20px}
.card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:grid;gap:14px}
.card h1{font-size:1.6rem;text-align:center}
.card > p{text-align:center}
.card svg{justify-self:center}
.seg-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg-tabs button{border:0;background:none;padding:8px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
.seg-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.form-err{color:var(--rose);font-size:.93rem;min-height:1.2em;text-align:center}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}

/* diálogo e formulário */
dialog{border:0;border-radius:18px;padding:0;width:min(660px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(8,18,12,.5)}
.dlg{display:grid;grid-template-rows:auto 1fr auto;max-height:calc(100dvh - 32px)}
.dlg-head{padding:20px 22px 8px}
.dlg-body{padding:8px 22px 16px;overflow:auto;display:grid;gap:14px}
.dlg-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.field{display:grid;gap:5px}
.field .lbl{font-weight:600;font-size:.93rem}
.field .hint{color:var(--muted);font-size:.85rem}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:64px}
input[type=file]{width:100%;font-size:.95rem}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.rep{display:grid;gap:10px}
.rep-row{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.scale{display:grid;gap:6px}
.scale-row{display:grid;grid-template-columns:minmax(140px,1fr) auto;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:5px 12px;font-weight:600;color:var(--muted)}
.seg input:checked+span{background:var(--moss);color:var(--on-moss)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:50}
.toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:520px;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:auto}
.toast div.err{background:var(--rose);color:#fff}
@media (max-width:560px){
  .panel{padding:16px}
  .tl li{grid-template-columns:70px 16px 1fr}
  .tl li::before{left:85px}
  .chart-box{height:250px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--ring-2);flex:0 0 auto}
.avatar-prev{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.avatar-prev[hidden]{display:none}
.auto{border-color:var(--moss)!important;background:var(--moss-soft)!important}
.auto-status{padding:10px 12px;border-radius:10px;background:var(--moss-soft);font-size:.92rem;margin:0}
.auto-status.warn{background:var(--amber-soft)}
.auto-status[hidden],.ocr-text[hidden]{display:none}
.ocr-text summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.ocr-text pre{white-space:pre-wrap;font-size:.82rem;max-height:200px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0 0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.swatch{display:grid;gap:8px;justify-items:start;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px;cursor:pointer;text-align:left}
.swatch:hover{border-color:var(--muted)}
.swatch[aria-pressed="true"]{border-color:var(--moss);box-shadow:0 0 0 3px var(--moss-soft)}
.sw-row{display:flex}
.sw-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);margin-right:-6px}
.sw-name{font-weight:600;font-size:.92rem}
.seg-tabs.three{grid-template-columns:repeat(3,1fr)}
.side,.btn,.kpi,.panel,.swatch,.nav button{transition:background-color .2s,border-color .2s,color .2s}

/* ===== v6 ===== */
.lembretes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lembrete{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.lembrete:hover{border-color:var(--moss)}
.lembrete .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--blue)}
.lembrete.alto .dot{background:var(--rose)} .lembrete.medio .dot{background:var(--amber)}
.blist{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.privado{background:var(--amber-soft);border-radius:8px;padding:6px 10px}
.tbl tr.gap td{background:var(--amber-soft)}
.notice.teste{background:var(--rose-soft);border-color:var(--rose);font-weight:700;margin-bottom:16px}
.filtros select,.filtros input{width:auto}
.filtros{gap:10px}
.termo{display:grid;gap:10px;max-height:46vh;overflow:auto;padding-right:6px;text-align:left}
.termo-check{align-items:flex-start;gap:8px}
.termo-check input{margin-top:4px}
.card > p.muted{text-align:center}
/* DISC */
.disc-test{max-width:640px}
.disc-prog{display:grid;gap:6px;margin-bottom:16px;color:var(--muted);font-size:.9rem}
.disc-prog .bar{height:8px;background:var(--ring-bg);border-radius:999px;overflow:hidden}
.disc-prog .bar i{display:block;height:100%;background:var(--moss)}
.disc-head,.disc-row{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center}
.disc-head{color:var(--muted);font-size:.85rem;font-weight:600;text-align:center;padding:0 0 6px}
.disc-row{padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface-2)}
.disc-row.is-m{border-color:var(--moss);background:var(--moss-soft)}
.disc-row.is-l{border-color:var(--rose);background:var(--rose-soft)}
.disc-word{font-weight:600;font-size:1.05rem}
.disc-pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 0;font-weight:600;cursor:pointer;color:var(--muted)}
.disc-pick.m[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.disc-pick.l[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.disc-legend{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.disc-legend div{display:grid;gap:2px}
.disc-tag{display:inline-block;color:#fff;font-weight:700;border-radius:6px;padding:1px 8px;font-size:.85rem}
.mini-meter{display:inline-block;width:44px;height:6px;background:var(--ring-bg);border-radius:999px;overflow:hidden;vertical-align:middle}
.mini-meter i{display:block;height:100%}
@media (max-width:560px){.disc-head,.disc-row{grid-template-columns:1fr 74px 74px}}
/* impressão */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body.printing{background:#fff!important;color:#111!important}
  body.printing #app,body.printing dialog,body.printing .toast{display:none!important}
  body.printing #print{display:block}
  .pr-cv{font:11pt/1.45 "Source Sans 3","Segoe UI",Arial,sans-serif;color:#111}
  .pr-cv h1{font-size:22pt;margin:0;color:#111}

async function squareJpeg(file, max) {

  const cv = document.createElement("canvas"); cv.width = cv.height = out;
  cv.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, out, out);

}

let clipSeq = 0;
function rings(list, size, name, uid) {
  const url = uid ? S.photos[uid] : null;
  const shown = [...list].sort(byDateAsc("concluido_em")).slice(-12);
  const c = size / 2, rMin = size * (url ? 0.3 : 0.2), rMax = size * 0.47;
  const svg = s("svg", { viewBox: `0 0 ${size} ${size}`, width: size, height: size, role: "img", "aria-label": `${name}: ${plural(list.length, "curso concluído", "cursos concluídos")}` });
  svg.append(s("circle", { cx: c, cy: c, r: rMax, class: "ring-bg" }));
  if (!shown.length) svg.append(s("circle", { cx: c, cy: c, r: (rMin + rMax) / 2 + 1, class: "ring-empty" }));
  const step = (rMax - rMin) / Math.max(shown.length, 1);
  shown.forEach((cert, i) => {
    const idx = Math.max(0, CATEGORIAS.indexOf(cert.categoria));
    const sw = Math.max(1.2, Math.min(step * 0.78, 1.2 + num(cert.carga_horas) / 8));
    svg.append(s("circle", { cx: c, cy: c, r: rMin + step * (i + 0.5), class: "ring r" + (idx % 3 + 1), "stroke-width": sw }, s("title", {}, cert.titulo || "Curso")));
  });
  svg.append(s("circle", { cx: c, cy: c, r: rMin * 0.92, class: "core" }));
  if (url) {
    const id = "foto" + (++clipSeq), r = rMin * 0.92;
    svg.append(s("defs", {}, s("clipPath", { id }, s("circle", { cx: c, cy: c, r }))));
    svg.append(s("image", { href: url, x: c - r, y: c - r, width: 2 * r, height: 2 * r, "clip-path": `url(#${id})`, preserveAspectRatio: "xMidYMid slice" }));
  } else {
    svg.append(s("text", { x: c, y: c, "text-anchor": "middle", "dominant-baseline": "central", class: "core-t", "font-size": size * 0.15 }, initials(name)));
  }
  return svg;
}

async function fetchAll(t) {

  for (;;) {
    const { data, error } = await sb.from(t).select("*").range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);

async function downloadBackup(btn) {
  if (!window.JSZip) { toast("Não foi possível carregar o gerador de backup. Recarregue a página.", true); return; }
  btn.disabled = true; const old = btn.textContent;
  try {
    const zip = new JSZip();
    const dados = { gerado_em: new Date().toISOString(), projeto: SUPABASE_URL };
    for (const t of ["evo_pessoas", "evo_certificados", "evo_avaliacoes", "evo_melhorias", "evo_oneaone", "evo_auditoria"]) {
      btn.textContent = `Copiando ${TABELAS[t] || "histórico"}…`;
      dados[t] = await fetchAll(t);
    }
    zip.file("dados.json", JSON.stringify(dados, null, 2));
    let n = 0;
    for (const p of dados.evo_pessoas) {
      const { data: files, error } = await sb.storage.from(BUCKET).list(p.user_id, { limit: 1000 });
      if (error) throw error;
      for (const f of files || []) {
        if (!f.id) continue;
        btn.textContent = `Copiando arquivos (${++n})…`;
        const dl = await sb.storage.from(BUCKET).download(`${p.user_id}/${f.name}`);
        if (dl.error) throw dl.error;
        zip.file(`certificados/${p.user_id}/${f.name}`, dl.data);
      }
    }
    btn.textContent = "Compactando…";
    const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
    const url = URL.createObjectURL(blob);
    const a = h("a", { href: url, download: `backup-evolucao-time-${today()}.zip` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    await sb.from("evo_config").upsert({ chave: "ultimo_backup", valor: new Date().toISOString(), atualizado_em: new Date().toISOString() });
    S.config.ultimo_backup = new Date().toISOString();
    toast(`Backup gerado com ${plural(n, "arquivo", "arquivos")} de certificado.`);
  } catch (e) { toast("O backup falhou: " + sbErr(e), true); }
  finally { btn.disabled = false; btn.textContent = old; }
}

/* ---------- lembretes ---------- */
function lembretes() {
  const out = [], t = today();
  const add = (nivel, texto, acao) => out.push({ nivel, texto, acao });
  const prazos = (id, nm, prefixo) => {
    for (const m of S.melh.get(id) || []) if (m.status !== "concluido" && m.prazo) {
      const d = daysUntil(m.prazo);
      if (d < 0) add("alto", `${prefixo}melhoria “${m.titulo}” com prazo vencido`, () => S.owner ? openPerson(id, "melhorias") : go("evolucao"));
      else if (d <= 7) add("medio", `${prefixo}melhoria “${m.titulo}” vence em ${plural(d, "dia", "dias")}`, () => S.owner ? openPerson(id, "melhorias") : go("evolucao"));
    }
    for (const p of S.pdi.get(id) || []) if (p.status !== "concluido" && p.prazo) {
      const d = daysUntil(p.prazo);
      if (d < 0) add("alto", `${prefixo}ação do PDI “${p.titulo}” com prazo vencido`, () => S.owner ? openPerson(id, "pdi") : go("evolucao"));
      else if (d <= 7) add("medio", `${prefixo}ação do PDI “${p.titulo}” vence em ${plural(d, "dia", "dias")}`, () => S.owner ? openPerson(id, "pdi") : go("evolucao"));
    }
    for (const c of certsOf(id)) { const v = validadeInfo(c); if (v && v.cls !== "concluido") add(v.cls === "late" ? "medio" : "info", `${prefixo}certificação “${c.titulo}”: ${v.txt.toLowerCase()}`, () => S.owner ? openPerson(id, "curriculo") : go("meu")); }
  };
  if (S.owner) {
    const pend = pending().length;
    if (pend) add("alto", `${plural(pend, "pedido", "pedidos")} de acesso aguardando aprovação`, () => go("aprovacoes"));
    for (const id of teamIds(false)) {
      const nm = nameOf(id).split(" ")[0] + ": ", st = personStats(id);
      if (st.lastOne == null) add("medio", nm + "nenhuma 1:1 registrada", () => openPerson(id, "oneaone"));
      else if (st.lastOne > 30) add("alto", nm + `última 1:1 há ${st.lastOne} dias`, () => openPerson(id, "oneaone"));
      if (st.next) { const d = daysUntil(st.next); if (d >= 0 && d <= 3) add("info", nm + `1:1 marcada para ${fmtDate(st.next)}`, () => openPerson(id, "oneaone")); }
      const rasc = (S.aval.get(id) || []).filter(a => !a.liberada).length;
      if (rasc) add("medio", nm + `${plural(rasc, "avaliação", "avaliações")} em rascunho, ainda não liberada para a pessoa`, () => openPerson(id, "avaliacoes"));
      const lastAuto = latest(S.auto.get(id), "data"), lastAv = latest(S.aval.get(id), "data");
      if (lastAuto && (!lastAv || lastAuto.data > lastAv.data)) add("medio", nm + "respondeu a autoavaliação e aguarda a sua avaliação", () => openPerson(id, "avaliacoes"));
      prazos(id, null, nm);
      if (!S.people.get(id)?.atualizado_em) add("info", nm + "currículo ainda não preenchido", () => openPerson(id, "curriculo"));
      if (!(S.disc.get(id) || []).length) add("info", nm + "perfil DISC ainda não respondido", () => openPerson(id, "disc"));
    }
    const ub = S.config.ultimo_backup, dias = ub ? daysSince(ub) : null;
    if (dias == null || dias > 30) add("alto", dias == null ? "Nenhum backup baixado ainda" : `Último backup há ${dias} dias`, () => go("historico"));
  } else {
    const id = S.me.user_id;
    if (!S.me.atualizado_em) add("medio", "Complete o seu currículo", () => go("meu"));
    if (!(S.disc.get(id) || []).length) add("medio", "Responda o seu perfil DISC", () => go("disc"));
    const lastAuto = latest(S.auto.get(id), "data");
    if (!lastAuto) add("medio", "Faça a sua autoavaliação de competências", () => formAutoavaliacao(id));
    else if (daysSince(lastAuto.data) > 90) add("info", "Sua última autoavaliação tem mais de 3 meses", () => formAutoavaliacao(id));
    const lastLib = latest(S.aval.get(id), "liberada_em");
    if (lastLib && daysSince(lastLib.liberada_em) <= 14) add("info", `Nova avaliação liberada em ${fmtDate(lastLib.liberada_em)}`, () => go("evolucao"));
    prazos(id, null, "");
  }
  const ord = { alto: 0, medio: 1, info: 2 };
  return out.sort((a, b) => ord[a.nivel] - ord[b.nivel]);
}

}

  const b = h("button", { type: "button", class: "btn", onclick: e => meusDados(e.currentTarget) }, "Baixar meus dados (.zip)");
  openModal({ title: "Meus dados", body: [
    h("p", {}, "Baixe uma cópia de todos os seus dados guardados no portal, com os arquivos que você enviou."),
    h("p", { class: "muted small" }, `Você aceitou o termo de uso de dados em ${fmtDate(S.me.aceite_termo_em)}.`),
    h("div", { class: "row" }, b, h("button", { type: "button", class: "btn ghost", onclick: termoModal }, "Ler o termo")),
    h("p", { class: "muted small" }, "Para corrigir ou apagar dados, fale com o seu gestor.")] });
}
function apagarPessoaModal(uid) {
  const nm = nameOf(uid);
  openModal({
    title: "Apagar dados definitivamente", submitLabel: "Apagar definitivamente",
    body: [
      h("p", {}, `Isto apaga para sempre todos os dados de ${nm}: currículo, certificados e arquivos, avaliações, autoavaliações, DISC, PDI, pontos de melhoria, reuniões 1:1 e o histórico de alterações. Não dá para desfazer nem restaurar.`),
      h("p", { class: "notice small" }, "Baixe um backup completo antes, se quiser guardar uma cópia."),
      field("Para confirmar, digite APAGAR", inp("confirma", "", "text", { autocomplete: "off" })),
    ],
    onSubmit: async form => {
      if (val(form, "confirma") !== "APAGAR") { toast("Digite APAGAR para confirmar.", true); return false; }
      const { data: files } = await sb.storage.from(BUCKET).list(uid, { limit: 1000 });
      const { error } = await sb.rpc("evo_apagar_pessoa", { p_uid: uid });
      if (error) { toast(sbErr(error), true); return false; }
      const paths = (files || []).filter(f => f.id).map(f => `${uid}/${f.name}`);
      if (paths.length) await sb.storage.from(BUCKET).remove(paths);
      S.view = "pessoas"; await refresh(); toast(`Dados de ${nm} apagados.`);
      return true;
    },
  });
}

/* ---------- gestores e configurações ---------- */
async function setGestor(uid, virar) {
  const p = S.people.get(uid) || S.gestores.find(g => g.user_id === uid) || {};
  const nm = p.nome || p.email;
  const msg = virar
    ? `Tornar ${nm} gestor? A pessoa passa a ver e editar tudo: avaliações, anotações privadas e 1:1 de todo o time, aprovar acessos e baixar backups.`
    : `Remover ${nm} da função de gestor? A pessoa volta a ver só os próprios dados.`;
  if (!(await confirmBox(msg, virar ? "Tornar gestor" : "Remover", !virar))) return;
  run(sb.from("evo_pessoas").update({ papel: virar ? "gestor" : "membro" }).eq("user_id", uid), virar ? "Gestor adicionado." : "Gestor removido.");
}
async function salvarDominios(input) {
  const lista = input.value.split(/[,\s]+/).map(d => d.trim().toLowerCase().replace(/^@/, "")).filter(Boolean);
  if (lista.some(d => !/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(d))) { toast("Algum domínio está inválido. Exemplo: lcsistemas.com.br", true); return; }
  if (!lista.length && !(await confirmBox("Sem domínios, qualquer e-mail poderá pedir acesso. Continuar?", "Continuar", true))) return;
  run(sb.from("evo_config").upsert({ chave: "dominios_permitidos", valor: lista, atualizado_em: new Date().toISOString() }), "Domínios atualizados.");
}
function novidadesModal() {
  openModal({ title: `Novidades da versão ${VERSAO}`, body: [h("ul", { class: "blist" }, NOVIDADES.map(n => h("li", {}, n)))] });
  try { localStorage.setItem("evo-versao-vista", VERSAO); } catch (e) {}
}
function talvezNovidades() {
  let vista = null; try { vista = localStorage.getItem("evo-versao-vista"); } catch (e) {}
  if (vista === VERSAO || talvezNovidades.agendado) return;
  talvezNovidades.agendado = true;
  setTimeout(() => { if (!document.getElementById("modal").open) novidadesModal(); else talvezNovidades.agendado = false; }, 400);
}

/* ---------- telas novas do time ---------- */
function viewInicio() {
  const uid = S.me.user_id, certs = certsOf(uid);
  const lastLib = latest(S.aval.get(uid), "data");
  const pdiPend = (S.pdi.get(uid) || []).filter(p => p.status !== "concluido").length;
  const disc = latest(S.disc.get(uid), "criado_em");
  return [
    h("div", { class: "page-head" }, h("div", {}, h("h1", {}, `Olá, ${(S.me.nome || "").split(" ")[0] || "tudo bem"}!`), h("p", {}, "Aqui está um resumo da sua evolução e o que está pendente."))),
    h("div", { class: "stack" },
      h("div", { class: "kpis" },
        kpi(certs.length, "cursos concluídos"), kpi(fmtH(hoursOf(certs)), "de formação"),
        kpi(fmt1(avgOf(lastLib)), "média da última avaliação"), kpi(pdiPend, "ações abertas no seu PDI"),
        kpi(disc ? disc.perfil : "–", disc ? DISC_INFO[disc.perfil[0]].estilo : "perfil DISC")),
      h("div", { class: "grid3" }, lembretesPanel(10),
        h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h2", {}, "Minha trilha de formação")), hoursTrailChart(uid, "short")))),
  ];
}
function viewEvolucao() {
  const uid = S.me.user_id;
  const avs = [...(S.aval.get(uid) || [])].sort(byDateDesc("data"));
  const ult = avs[0], melh = S.melh.get(uid) || [];
  const comp = comparacao(uid);
  return [
    h("div", { class: "page-head" }, h("div", {}, h("h1", {}, "Minha evolução"), h("p", {}, "Seu mapa de competências, o feedback do gestor e o seu plano de desenvolvimento.")),
      h("button", { class: "btn", onclick: () => formAutoavaliacao(uid) }, "Fazer autoavaliação")),
    h("div", { class: "stack" },
      h("div", { class: "grid2" },
        h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h2", {}, "Mapa de competências"), h("p", {}, "Sua autoavaliação e a avaliação do gestor.")), radarChart(uid)),
        h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h2", {}, "Evolução nas avaliações")), personEvolutionChart(uid))),
      ult && h("div", { class: "panel" },
        h("div", { class: "panel-head" }, h("h2", {}, "Feedback da última avaliação"), h("p", {}, `${fmtDate(ult.data)}${ult.periodo ? `, ${ult.periodo}` : ""}`)),
        ult.fortes && h("div", {}, h("h3", {}, "Pontos fortes"), h("p", { class: "prose", style: "margin:6px 0 12px" }, ult.fortes)),
        ult.feedback ? h("div", {}, h("h3", {}, "Feedback do gestor"), h("p", { class: "prose", style: "margin-top:6px" }, ult.feedback)) : h("p", { class: "muted" }, "Sem feedback escrito nesta avaliação.")),
      comp && h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h2", {}, "Como você se vê e como o gestor vê")), comp),
      !ult && h("div", { class: "panel" }, h("p", { class: "muted" }, "Nenhuma avaliação liberada ainda. Quando o gestor liberar, o mapa e o feedback aparecem aqui.")),
      h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h2", {}, "Meu plano de desenvolvimento (PDI)")), pdiLista(uid, false)),
      h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h2", {}, "Pontos de melhoria")),
        melh.length ? h("ul", { class: "list" }, [...melh].sort(byDateDesc("criado_em")).map(m => h("li", { class: "item" },
          h("div", { class: "item-top" }, h("h3", {}, m.titulo), h("span", { class: "pill " + (STATUS[m.status] ? m.status : "aberto") }, STATUS[m.status] || "Aberto")),
          h("p", { class: "meta" }, [m.prazo && `prazo ${fmtDate(m.prazo)}`, m.concluido_em && `concluído em ${fmtDate(m.concluido_em)}`].filter(Boolean).join(", ")),
          m.descricao && h("p", { class: "prose" }, m.descricao)))) : h("p", { class: "muted" }, "Nenhum ponto de melhoria registrado.")),
      avs.length > 1 && h("div", { class: "panel" }, h("div", { class: "panel-head" }, h("h2", {}, "Avaliações anteriores")),
        h("ul", { class: "list" }, avs.slice(1).map(a => h("li", { class: "item" },
          h("div", { class: "item-top" }, h("h3", {}, `${fmtDate(a.data)}${a.periodo ? `, ${a.periodo}` : ""}`), h("span", {}, "Média ", h("b", {}, fmt1(avgOf(a))))),
          a.feedback && h("p", { class: "prose" }, a.feedback)))))),
  ];
}

/* ---------- início ---------- */
let lastUser = null;
sb.auth.onAuthStateChange((event, session) => {
  S.session = session; S.ready = true;
  if (event === "PASSWORD_RECOVERY") { S.recovery = true; render(); }
  const uid = session?.user?.id || null;
  if (!uid) { lastUser = null; S.me = null; S.owner = false; S.people = new Map(); S.auto = new Map(); S.disc = new Map(); S.pdi = new Map(); S.privado = new Map(); S.gestores = []; S.config = {}; S.discDraft = null; S.recovery = false; S.view = "painel"; clearTimeout(idleTimer); render(); return; }
  lastBump = 0; bumpIdle();
  if (uid !== lastUser) {
    lastUser = uid; S.loading = true; render();
    setTimeout(async () => { await refresh(); S.loading = false; render(); }, 0);
  }
});
</script>

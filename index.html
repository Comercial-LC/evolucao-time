<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Evolução do time comercial | LC Sistemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F5F8F5; --ink:#17241D; --muted:#56665D; --line:#D2DBD4;
  --moss:#2F6B45; --moss-soft:#DCEBDF; --on-moss:#FFFFFF;
  --amber:#9A6209; --amber-soft:#F6E8CF; --rose:#A8423A; --rose-soft:#F6DFDC;
  --ring-1:#2F6B45; --ring-2:#6FA57C; --ring-3:#B5D3BA; --ring-bg:#E3EAE4; --focus:#1E5FA8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#17211B; --surface-2:#1D2923; --ink:#E5EEE8; --muted:#9BAFA3; --line:#2B3A31;
    --moss:#7CC08F; --moss-soft:#1E3526; --on-moss:#0C1810;
    --amber:#E3AA4E; --amber-soft:#382C15; --rose:#E88C82; --rose-soft:#3A1F1C;
    --ring-1:#7CC08F; --ring-2:#4E8A5F; --ring-3:#2E5639; --ring-bg:#1F2C24; --focus:#80B4F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211B; --surface-2:#1D2923; --ink:#E5EEE8; --muted:#9BAFA3; --line:#2B3A31;
  --moss:#7CC08F; --moss-soft:#1E3526; --on-moss:#0C1810;
  --amber:#E3AA4E; --amber-soft:#382C15; --rose:#E88C82; --rose-soft:#3A1F1C;
  --ring-1:#7CC08F; --ring-2:#4E8A5F; --ring-3:#2E5639; --ring-bg:#1F2C24; --focus:#80B4F0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0;letter-spacing:-0.01em}
h1{font-size:clamp(1.8rem,4vw,2.6rem)}
h2{font-size:1.5rem}
h3{font-size:1.1rem;font-weight:500}
p{margin:0}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* hero */
.hero{display:grid;gap:18px;margin-bottom:28px}
.hero-top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hero-sub{max-width:62ch;color:var(--muted);margin-top:6px}
.figures{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:.95rem}
.figures b{color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;margin-right:4px}
.grove{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:thin}
.tree{flex:0 0 auto;display:grid;justify-items:center;gap:4px;width:118px;padding:10px 6px 12px;border:0;background:transparent;border-radius:14px;cursor:pointer;text-align:center}
.tree:hover{background:var(--surface-2)}
.tree[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 -3px 0 var(--moss)}
.tree .nm{font-weight:600;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .ct{font-size:.85rem;color:var(--muted)}
.tree.archived{opacity:.55}

/* rings */
.ring-bg{fill:var(--ring-bg)}
.ring{fill:none}
.ring.r1{stroke:var(--ring-1)} .ring.r2{stroke:var(--ring-2)} .ring.r3{stroke:var(--ring-3)}
.ring-empty{fill:none;stroke:var(--line);stroke-dasharray:3 4;stroke-width:1.5}
.core{fill:var(--surface)}
.core-t{fill:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--moss);color:var(--on-moss);padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.danger{background:transparent;color:var(--rose);border-color:var(--rose-soft)}
.linkish{border:0;background:none;padding:0;color:var(--moss);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.detail{display:grid;gap:18px}
.detail-head{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.detail-head .who{flex:1 1 240px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--moss)}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:.9rem}
.delta-up{color:var(--moss);font-weight:600}
.delta-down{color:var(--rose);font-weight:600}
.sec-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}

/* lists */
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface-2);display:grid;gap:6px}
.item-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.item h3{font-size:1.05rem}
.meta{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:600}
.pill.aberto{background:var(--amber-soft);color:var(--amber)}
.pill.andamento{background:var(--moss-soft);color:var(--moss)}
.pill.concluido{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.pill.late{background:var(--rose-soft);color:var(--rose)}
.prose{white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--moss-soft);color:var(--ink);padding:3px 12px;border-radius:999px;font-size:.92rem}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.cert{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.doc-ico{width:64px;height:64px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--muted);font-weight:700;font-size:.85rem}

/* curriculum */
.cv{display:grid;gap:22px}
.cv-head{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.cv section{display:grid;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
.exp{display:grid;gap:2px}
.exp b{font-weight:600}

/* bars */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;font-size:.95rem}
.bar{height:10px;background:var(--ring-bg);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:999px}
.mini-bars{display:flex;gap:3px;align-items:flex-end;height:26px}
.mini-bars i{width:8px;background:var(--ring-2);border-radius:2px 2px 0 0}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:"Source Sans 3",sans-serif}
.chart .line{fill:none;stroke:var(--moss);stroke-width:2.5;stroke-linejoin:round}
.chart .dot{fill:var(--surface);stroke:var(--moss);stroke-width:2.5}
.chart .val{fill:var(--ink);font-size:12px;font-weight:600;font-family:"Source Sans 3",sans-serif}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:86px 16px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl .d{color:var(--muted);font-size:.88rem;text-align:right;padding-top:1px}
.tl .k{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--moss);position:relative;z-index:1}
.tl li::before{content:"";position:absolute;left:101px;top:12px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .k.aval{background:var(--focus)} .tl .k.one{background:var(--ring-2)} .tl .k.melh{background:var(--amber)} .tl .k.ok{background:var(--surface);border:2px solid var(--moss)}

/* empty / notices */
.empty{display:grid;gap:12px;justify-items:start;padding:26px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.notice{padding:12px 16px;border-radius:12px;background:var(--amber-soft);color:var(--ink);border:1px solid var(--line)}

/* dialog + form */
dialog{border:0;border-radius:18px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,14,.45)}
.dlg{display:grid;grid-template-rows:auto 1fr auto;max-height:calc(100dvh - 32px)}
.dlg-head{padding:20px 22px 8px}
.dlg-body{padding:8px 22px 16px;overflow:auto;display:grid;gap:14px}
.dlg-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.field{display:grid;gap:5px}
.field .lbl{font-weight:600;font-size:.93rem}
.field .hint{color:var(--muted);font-size:.85rem}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:64px}
input[type=file]{width:100%;font-size:.95rem}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.rep{display:grid;gap:10px}
.rep-row{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.scale{display:grid;gap:6px}
.scale-row{display:grid;grid-template-columns:minmax(140px,1fr) auto;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:5px 12px;font-weight:600;color:var(--muted)}
.seg input:checked+span{background:var(--moss);color:var(--on-moss)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
.results{display:grid;gap:4px}
.person-hit{display:flex;gap:10px;align-items:center;border:0;background:var(--surface-2);padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left}
.person-hit:hover{background:var(--moss-soft)}
.person-hit img{border-radius:50%}

.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:50}
.toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:520px;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:auto}
.toast div.err{background:var(--rose);color:#fff}
@media (max-width:560px){
  .wrap{padding:20px 14px 80px}
  .panel{padding:16px}
  .tl li{grid-template-columns:70px 16px 1fr}
  .tl li::before{left:85px}
  .bar-row{grid-template-columns:1fr auto;}
  .bar-row .bar{grid-column:1 / -1;order:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.topbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:22px;color:var(--muted);font-size:.93rem}
.topbar .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--ink);font-size:1rem}
.login{min-height:calc(100dvh - 140px);display:grid;place-items:center}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:grid;gap:16px;justify-items:stretch}
.login-card svg{justify-self:center}
.login-card h1{font-size:1.7rem;text-align:center}
.login-card p{text-align:center}
.form-err{color:var(--rose);font-size:.93rem;min-height:1.2em;text-align:center}
input[type=email],input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* =========================================================
   CONFIGURAÇÃO — cole aqui a anon key do projeto Contratos Comerciais
   ========================================================= */
const SUPABASE_URL = "https://wrbbmtaxerlqzaqfctqn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyYmJtdGF4ZXJscXphcWZjdHFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2OTU1ODEsImV4cCI6MjExMTI3MTU4MX0.OwyQ-iqqvZEaAxF67DmqECR7J7fSUo9QtSxzXQ4D138";
const BUCKET = "evo-certificados";

const COMPETENCIAS = [
  ["sistema", "Conhecimento do sistema"],
  ["comunicacao", "Comunicação"],
  ["atendimento", "Atendimento ao cliente"],
  ["organizacao", "Organização e uso do CRM"],
  ["proatividade", "Proatividade"],
  ["equipe", "Trabalho em equipe"],
  ["resultados", "Resultados e metas"],
];
const CATEGORIAS = ["Vendas e negociação", "Produto e sistema", "Atendimento ao cliente", "Gestão e liderança", "Tecnologia", "Outro"];
const STATUS = { aberto: "Aberto", andamento: "Em andamento", concluido: "Concluído" };

// storageKey próprio: o login daqui não se mistura com o login do Portal
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: "evo-time-auth", persistSession: true, autoRefreshToken: true },
});

/* ---------- estado ---------- */
const S = {
  session: null, me: null, owner: false, ready: false, loading: false, error: null,
  members: new Map(), certs: new Map(), aval: new Map(), melh: new Map(), ones: new Map(),
  selected: null, tab: "geral", showArchived: false,
};

/* ---------- DOM ---------- */
const NS = "http://www.w3.org/2000/svg";
function build(el, props, kids) {
  let pendingValue;
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value" && el.namespaceURI !== NS) pendingValue = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  if (pendingValue !== undefined) el.value = pendingValue;
  return el;
}
const h = (tag, props, ...kids) => build(document.createElement(tag), props, kids);
const s = (tag, props, ...kids) => build(document.createElementNS(NS, tag), props, kids);

/* ---------- utilitários ---------- */
const pad = n => String(n).padStart(2, "0");
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dateOnly(v) { return typeof v === "string" ? v.slice(0, 10) : ""; }
function fmtDate(v) { const d = dateOnly(v); if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return "sem data"; const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}`; }
function daysSince(v) { const d = dateOnly(v); if (!d) return null; const [y, m, dd] = d.split("-").map(Number); return Math.floor((Date.now() - new Date(y, m - 1, dd)) / 86400000); }
const byDateAsc = k => (a, b) => (dateOnly(a[k]) || "").localeCompare(dateOnly(b[k]) || "");
const byDateDesc = k => (a, b) => (dateOnly(b[k]) || "").localeCompare(dateOnly(a[k]) || "");
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const nz = v => (v === "" || v == null ? null : v);
function avgOf(a) { const v = Object.values(a?.notas || {}).map(Number).filter(n => n >= 1 && n <= 5); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; }
const fmt1 = n => n == null ? "sem nota" : n.toFixed(1).replace(".", ",");
function initials(name) { const p = String(name || "?").trim().split(/\s+/).filter(Boolean); return ((p[0]?.[0] || "?") + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); }
function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }
const displayName = uid => S.members.get(uid)?.nome || "Pessoa sem nome";
const certsOf = uid => S.certs.get(uid) || [];
const hoursOf = list => list.reduce((t, c) => t + num(c.carga_horas), 0);
function groupBy(rows) { const m = new Map(); for (const r of rows || []) { if (!m.has(r.user_id)) m.set(r.user_id, []); m.get(r.user_id).push(r); } return m; }

/* ---------- avisos ---------- */
let toastTimer;
function toast(msg, err) {
  const box = document.querySelector(".toast");
  box.replaceChildren(h("div", { class: err ? "err" : "" }, msg));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.replaceChildren(), err ? 6000 : 3200);
}
function sbErr(e) {
  const msg = String(e?.message || "");
  if (/row-level security|permission denied/i.test(msg)) return "Sem permissão para essa ação.";
  if (/JWT|session/i.test(msg)) return "Sua sessão expirou. Entre de novo.";
  if (/Failed to fetch|NetworkError/i.test(msg)) return "Sem conexão. Verifique a internet e tente de novo.";
  if (/exceeded the maximum allowed size|Payload too large/i.test(msg)) return "O arquivo passa de 20 MB.";
  if (/mime type/i.test(msg)) return "Formato não aceito. Envie PDF, PNG, JPG ou WEBP.";
  return msg || "Não foi possível concluir. Tente de novo.";
}
async function run(query, okMsg) {
  const { error } = await query;
  if (error) { toast(sbErr(error), true); return false; }
  await refresh();
  if (okMsg) toast(okMsg);
  return true;
}

/* ---------- dados ---------- */
async function load() {
  const uid = S.session.user.id;
  const { data: me, error } = await sb.from("evo_pessoas").select("*").eq("user_id", uid).maybeSingle();
  if (error) throw error;
  S.me = me;
  S.owner = !!me && me.papel === "gestor" && !me.arquivado;
  if (!me) return;
  if (S.owner) {
    const [p, c, a, m, o] = await Promise.all([
      sb.from("evo_pessoas").select("*").eq("papel", "membro"),
      sb.from("evo_certificados").select("*"),
      sb.from("evo_avaliacoes").select("*"),
      sb.from("evo_melhorias").select("*"),
      sb.from("evo_oneaone").select("*"),
    ]);
    for (const r of [p, c, a, m, o]) if (r.error) throw r.error;
    S.members = new Map(p.data.map(r => [r.user_id, r]));
    S.certs = groupBy(c.data); S.aval = groupBy(a.data); S.melh = groupBy(m.data); S.ones = groupBy(o.data);
    const ids = activeIds();
    if (!S.selected || !S.members.has(S.selected)) S.selected = ids[0] || null;
  } else {
    const c = await sb.from("evo_certificados").select("*").eq("user_id", uid);
    if (c.error) throw c.error;
    S.members = new Map([[uid, me]]);
    S.certs = groupBy(c.data);
  }
}

function rings(list, size, name) {
  const shown = [...list].sort(byDateAsc("concluido_em")).slice(-12);
  const c = size / 2, rMin = size * 0.2, rMax = size * 0.47;
  const svg = s("svg", { viewBox: `0 0 ${size} ${size}`, width: size, height: size, role: "img",
    "aria-label": `${name}: ${plural(list.length, "curso concluído", "cursos concluídos")}` });
  svg.append(s("circle", { cx: c, cy: c, r: rMax, class: "ring-bg" }));
  if (!shown.length) svg.append(s("circle", { cx: c, cy: c, r: (rMin + rMax) / 2 + 2, class: "ring-empty" }));
  const step = (rMax - rMin) / Math.max(shown.length, 1);
  shown.forEach((cert, i) => {
    const idx = Math.max(0, CATEGORIAS.indexOf(cert.categoria));
    const sw = Math.max(1.4, Math.min(step * 0.78, 1.4 + num(cert.carga_horas) / 8));
    svg.append(s("circle", { cx: c, cy: c, r: rMin + step * (i + 0.5), class: "ring r" + (idx % 3 + 1), "stroke-width": sw },
      s("title", {}, `${cert.titulo || "Curso"}${cert.carga_horas ? `, ${cert.carga_horas} h` : ""}`)));
  });
  svg.append(s("circle", { cx: c, cy: c, r: rMin * 0.92, class: "core" }));
  svg.append(s("text", { x: c, y: c, "text-anchor": "middle", "dominant-baseline": "central", class: "core-t", "font-size": size * 0.15 }, initials(name)));
  return svg;
}

const field = (label, input, hint) => h("label", { class: "field" }, h("span", { class: "lbl" }, label), input, hint && h("span", { class: "hint" }, hint));
const inp = (name, val, type = "text", extra = {}) => h("input", { name, type, value: val ?? "", ...extra });

function openModal({ title, body, submitLabel, onSubmit }) {
  const dlg = document.getElementById("modal");
  const btn = submitLabel ? h("button", { type: "submit", class: "btn" }, submitLabel) : null;
  const form = h("form", { class: "dlg", novalidate: true },
    h("div", { class: "dlg-head" }, h("h2", {}, title)),
    h("div", { class: "dlg-body" }, body),
    h("div", { class: "dlg-foot" },
      h("button", { type: "button", class: "btn ghost", onclick: () => dlg.close() }, submitLabel ? "Cancelar" : "Fechar"), btn));
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!onSubmit) return;
    btn.disabled = true; const old = btn.textContent; btn.textContent = "Salvando…";
    let ok = false;
    try { ok = await onSubmit(form); } finally { btn.disabled = false; btn.textContent = old; }
    if (ok) dlg.close();
  });
  dlg.replaceChildren(form);
  dlg.showModal();
  return form;
}
function confirmBox(message, label) {
  return new Promise(resolve => {
    const dlg = document.getElementById("confirm");
    const done = v => { dlg.close(); resolve(v); };
    dlg.replaceChildren(h("div", { class: "dlg" },
      h("div", { class: "dlg-head" }, h("h2", {}, "Confirmar")),
      h("div", { class: "dlg-body" }, h("p", {}, message)),
      h("div", { class: "dlg-foot" },
        h("button", { type: "button", class: "btn ghost", onclick: () => done(false) }, "Cancelar"),
        h("button", { type: "button", class: "btn", onclick: () => done(true) }, label))));
    dlg.addEventListener("cancel", () => resolve(false), { once: true });
    dlg.showModal();
  });
}
function repeater(name, items, fields, addLabel) {
  const list = h("div", { class: "rep" });
  const addRow = (it = {}) => {
    const row = h("div", { class: "rep-row", "data-rep": name },
      h("div", { class: "two" }, fields.filter(f => f[2] !== "textarea").map(([k, l]) => field(l, inp(`${name}_${k}`, it[k])))),
      fields.filter(f => f[2] === "textarea").map(([k, l]) => field(l, ta(`${name}_${k}`, it[k], 2))),
      h("div", {}, h("button", { type: "button", class: "btn ghost small", onclick: () => row.remove() }, "Remover")));
    list.append(row);
  };
  (Array.isArray(items) ? items : []).forEach(addRow);
  return h("div", { class: "rep" }, list, h("div", {}, h("button", { type: "button", class: "btn ghost small", onclick: () => addRow() }, addLabel)));
}
function readRep(form, name, keys) {
  return [...form.querySelectorAll(`[data-rep="${name}"]`)].map(r =>
    Object.fromEntries(keys.map(k => [k, (r.querySelector(`[name="${name}_${k}"]`)?.value || "").trim()])))
    .filter(o => keys.some(k => o[k]));
}

function guessType(file) {
  const ok = ["application/pdf", "image/png", "image/jpeg", "image/webp"];
  if (ok.includes(file.type)) return file.type;
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  return { pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp" }[ext] || null;
}
function formCertificado(uid, existing) {
  const c = existing || {};
  openModal({
    title: existing ? "Editar certificado" : "Adicionar certificado",
    submitLabel: existing ? "Salvar alterações" : "Adicionar ao currículo",
    body: [
      field("Nome do curso", inp("titulo", c.titulo)),
      h("div", { class: "two" },
        field("Instituição", inp("instituicao", c.instituicao)),
        field("Área", sel("categoria", CATEGORIAS.map(x => [x, x]), c.categoria || CATEGORIAS[0]))),
      h("div", { class: "two" },
        field("Carga horária (horas)", inp("carga_horas", c.carga_horas ?? "", "number", { min: 0, step: "0.5", inputmode: "decimal" })),
        field("Concluído em", inp("concluido_em", c.concluido_em || today(), "date"))),
      field(c.arquivo_path ? "Trocar arquivo do certificado" : "Arquivo do certificado",
        h("input", { type: "file", name: "arquivo", accept: ".pdf,.png,.jpg,.jpeg,.webp" }), "PDF ou imagem, até 20 MB."),
    ],
    onSubmit: async form => {
      const titulo = val(form, "titulo");
      if (!titulo) { toast("Informe o nome do curso.", true); return false; }
      const row = {
        user_id: uid, titulo, instituicao: nz(val(form, "instituicao")), categoria: val(form, "categoria"),
        carga_horas: Math.max(0, Number(val(form, "carga_horas").replace(",", ".")) || 0),
        concluido_em: val(form, "concluido_em") || today(),
      };
      const file = form.elements.namedItem("arquivo")?.files?.[0];
      let oldPath = null;
      if (file) {
        const type = guessType(file);
        if (!type) { toast("Formato não aceito. Envie PDF, PNG, JPG ou WEBP.", true); return false; }
        if (file.size > 20 * 1024 * 1024) { toast("O arquivo passa de 20 MB.", true); return false; }
        const ext = { "application/pdf": "pdf", "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp" }[type];
        const path = `${uid}/${crypto.randomUUID()}.${ext}`;
        const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: type, upsert: false });
        if (up.error) { toast(sbErr(up.error), true); return false; }
        oldPath = c.arquivo_path || null;
        Object.assign(row, { arquivo_path: path, arquivo_nome: file.name.slice(0, 160), arquivo_tipo: type });
      }
      const q = existing ? sb.from("evo_certificados").update(row).eq("id", existing.id) : sb.from("evo_certificados").insert(row);
      const ok = await run(q, existing ? "Certificado atualizado." : "Certificado adicionado ao currículo.");
      if (ok && oldPath) await sb.storage.from(BUCKET).remove([oldPath]);
      if (!ok && row.arquivo_path) await sb.storage.from(BUCKET).remove([row.arquivo_path]);
      return ok;
    },
  });
}

function evoChart(avals) {
  const pts = [...avals].sort(byDateAsc("data")).map(a => ({ d: a.data, v: avgOf(a) })).filter(p => p.v != null);
  if (pts.length < 2) return h("p", { class: "muted" }, "O gráfico de evolução aparece a partir da segunda avaliação.");
  const W = 600, H = 210, L = 30, R = 20, T = 18, B = 30, n = pts.length;
  const x = i => L + i * (W - L - R) / (n - 1), y = v => T + (5 - v) * (H - T - B) / 4;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Média das avaliações de ${fmt1(pts[0].v)} para ${fmt1(pts[n - 1].v)}` });
  for (let v = 1; v <= 5; v++) {
    svg.append(s("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), class: "grid" }));
    svg.append(s("text", { x: L - 10, y: y(v), class: "axis", "text-anchor": "end", "dominant-baseline": "central" }, v));
  }
  svg.append(s("polyline", { class: "line", points: pts.map((p, i) => `${x(i)},${y(p.v)}`).join(" ") }));
  const every = Math.ceil(n / 6);
  pts.forEach((p, i) => {
